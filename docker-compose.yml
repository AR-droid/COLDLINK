services:
  falkordb:
    image: falkordb/falkordb:latest
    ports:
      - "6379:6379"   # Redis protocol (FalkorDB)
      - "3000:3000"   # FalkorDB Browser: http://localhost:3000
    environment:
      # Defaults are TIMEOUT 1000 (ms); the loader's similarity pass needs longer.
      FALKORDB_ARGS: "MAX_QUEUED_QUERIES 25 TIMEOUT 30000 RESULTSET_SIZE 20000"
    volumes:
      - falkordb-data:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  # Generates the synthetic dataset, loads it and runs the two-scenario demo.
  coldlink:
    build: .
    depends_on:
      falkordb:
        condition: service_healthy
    environment:
      FALKORDB_HOST: falkordb
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - ./data:/app/data
      - ./runs:/app/runs

  # Optional: the official FalkorDB MCP server for raw read-only Cypher.
  # docker compose --profile mcp up
  falkordb-mcp:
    image: falkordb/mcpserver:latest
    profiles: ["mcp"]
    depends_on: [falkordb]
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      FALKORDB_DEFAULT_READONLY: "true"
      MCP_TRANSPORT: http
      MCP_PORT: "8080"
    ports:
      - "8080:8080"

volumes:
  falkordb-data:
